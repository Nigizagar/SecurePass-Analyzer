{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="text-cyber mb-4"><i class="fa-solid fa-gears me-2"></i>Secure Generator Engine</h3>
            
            <div class="mb-4 p-3 bg-dark rounded border border-secondary text-center position-relative">
                <h2 id="generatedPasswordDisplay" class="text-warning fw-bold my-2" style="letter-spacing: 2px;">⚡⚡⚡⚡⚡⚡</h2>
                <button id="btnCopy" class="btn btn-sm btn-cyber position-absolute top-50 end-0 translate-middle-y me-3"><i class="fa-regular fa-copy"></i> Salin</button>
            </div>

            <div class="mb-3">
                <label class="form-label d-flex justify-content-between">
                    <span>Panjang Karakter:</span>
                    <span id="lengthVal" class="text-cyber fw-bold">14</span>
                </label>
                <input type="range" class="form-range" id="lengthSlider" min="8" max="64" value="14">
            </div>

            <div class="row mb-4">
                <div class="col-6 mb-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="chkUpper" checked>
                        <label class="form-check-input-label">Huruf Besar (A-Z)</label>
                    </div>
                </div>
                <div class="col-6 mb-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="chkLower" checked>
                        <label class="form-check-input-label">Huruf Kecil (a-z)</label>
                    </div>
                </div>
                <div class="col-6 mb-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="chkDigits" checked>
                        <label class="form-check-input-label">Angka (0-9)</label>
                    </div>
                </div>
                <div class="col-6 mb-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="chkSymbols" checked>
                        <label class="form-check-input-label">Karakter Spesial (!@#$)</label>
                    </div>
                </div>
            </div>

            <button id="btnGenerate" class="btn btn-cyber w-100 btn-lg"><i class="fa-solid fa-dice me-2"></i>Buat Sandi Aman</button>
        </div>
    </div>
</div>

<script>
    const slider = document.getElementById('lengthSlider');
    slider.addEventListener('input', () => document.getElementById('lengthVal').innerText = slider.value);

    document.getElementById('btnGenerate').addEventListener('click', function() {
        const params = new URLSearchParams();
        params.append('length', slider.value);
        params.append('upper', document.getElementById('chkUpper').checked);
        params.append('lower', document.getElementById('chkLower').checked);
        params.append('digits', document.getElementById('chkDigits').checked);
        params.append('symbols', document.getElementById('chkSymbols').checked);

        fetch('/generator', { method: 'POST', body: params })
        .then(res => res.json())
        .then(data => {
            document.getElementById('generatedPasswordDisplay').innerText = data.password;
        });
    });

    document.getElementById('btnCopy').addEventListener('click', function() {
        const text = document.getElementById('generatedPasswordDisplay').innerText;
        if(text === "⚡⚡⚡⚡⚡⚡") return;
        navigator.clipboard.writeText(text);
        alert("Sandi berhasil disalin ke clipboard!");
    });
</script>
{% endblock %}

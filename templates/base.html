<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass Analyzer - Cyber Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #e4e6eb; /* Mengubah teks dasar menjadi abu-abu terang yang kontras */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #161b22 !important;
            border-bottom: 2px solid #00ffcc;
        }
        .navbar-brand, .nav-link {
            color: #00ffcc !important;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.05);
        }
        .text-cyber {
            color: #00ffcc;
        }
        /* Kelas baru untuk memastikan semua teks deskripsi/penjelasan berwarna putih terang */
        .text-desc, p, label, li {
            color: #ffffff !important;
        }
        .btn-cyber {
            background-color: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            transition: all 0.3s ease;
        }
        .btn-cyber:hover {
            background-color: #00ffcc;
            color: #0b0f19;
            box-shadow: 0 0 10px #00ffcc;
        }
        .form-control {
            color: #ffffff !important;
        }
        .form-control::placeholder {
            color: #8b949e !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-shield-halved me-2"></i>SecurePass</a>
            <button class="navbar-brand navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analyzer"><i class="fa-solid fa-chart-line me-1"></i> Analyzer</a></li>
                    <li class="nav-item"><a class="nav-link" href="/generator"><i class="fa-solid fa-key me-1"></i> Generator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/history"><i class="fa-solid fa-clock-history me-1"></i> Dashboard Stats</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about"><i class="fa-solid fa-circle-info me-1"></i>About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 border-top border-secondary text-muted">
        <p>&copy; 2026 SecurePass Analyzer App | Portfolio Cyber Security Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
